name: committer

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: committer-agora
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Ref $GITHUB_REF is not refs/heads/main" >&2
            exit 1
          fi
          REMOTE_SHA=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r .sha)
          if [ -z "$REMOTE_SHA" ] || [ "$REMOTE_SHA" = "null" ]; then
            echo "Failed to fetch remote main HEAD" >&2
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$REMOTE_SHA" ]; then
            echo "Run sha $GITHUB_SHA does not match remote main HEAD $REMOTE_SHA" >&2
            exit 1
          fi

      - name: setup-uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: secrets-to-rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "$RCLONE_CONF" > "$RUNNER_TEMP/rclone.conf"
          chmod 600 "$RUNNER_TEMP/rclone.conf"

      - name: inbox-prescan
        id: prescan
        env:
          AISTORAGE_RCLONE_CONF: ${{ runner.temp }}/rclone.conf
        run: |
          # 讀不到收件匣必須讓整個 job 失敗（不可 || true），否則錯誤會被掩蓋
          RESULT=$(uv run python -m aistorage.committer prescan --config config/committer.json)
          echo "shaped=$RESULT" >> "$GITHUB_OUTPUT"
          echo "形狀符合的收件匣項目數: $RESULT"

      - name: install-tools
        if: steps.prescan.outputs.shaped != '0'
        env:
          # M7：工具的版本、網址與 SHA256 集中在這裡，升級時三個一起改。
          # 改版號或改 sha 之前先看 docs/impl/group3-modules.md 第 7.1 節的「工具升級」。
          # git-annex 還多一處依賴：`AnnexGit.local_manifest_sha256()` 讀的是
          # git-remote-annex 留在**本機**的快取
          # `.git/annex/git-remote-annex/<uuid>/manifest`（第 11 步用它算出「這一輪
          # 實際寫出去的那份主 manifest」的內容雜湊，記進 pending 的
          # expected_manifest_sha256）。那是實作細節、不是公開介面：升級後如果它換了
          # 路徑或不再留著，H1 會退回 fail-closed（報告印
          # expected_manifest=UNRECORDED，settle／sweep 遇到多份候選就中止）。
          # 升級後**必須重跑** tests/integration/test_committer_dup_manifest.py
          # （它斷言本機那份的 sha256 == push 之後遠端那份的 sha256），不要只看流程跑完。
          GIT_ANNEX_VERSION: "10.20260717"
          GIT_ANNEX_URL: "https://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz"
          GIT_ANNEX_SHA256: "a3c9d10ee33a7ace69efeaa8cd6282cfd7444ec797d732cebae12a64efefa18a"
          # rclone 的版本**不能隨意升**：整套同名檔去留規則建立在「rclone 每次 push
          # 都刪掉重建 GITMANIFEST（file id 每輪都會變）」這個實測上（1.75.1 與
          # 1.69.3 都如此，見 docs/decision-log.md 2026-09-30 與
          # tests/integration/test_committer_dup_manifest.py）。若某個版本改成**原地
          # 更新**，而它剛好更新到住民建立的那份副本，正式 manifest 就會住進住民
          # 控制的 file id 裡。升級前請先在整合沙盒跑那支測試。
          RCLONE_VERSION: "1.75.1"
          RCLONE_SHA256: "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab"
        run: |
          set -eu
          # git-annex（standalone tarball，amd64）
          # 上游只提供 current/（沒有帶版本號的目錄），所以網址會跟著上游動：
          #   sha256 不符 = 上游發了新版本。請照下面印出來的版本與
          #   docs 的升級步驟更新 GIT_ANNEX_VERSION 與 GIT_ANNEX_SHA256 再 push。
          if ! curl -fsSL "$GIT_ANNEX_URL" -o /tmp/git-annex.tar.gz; then
            echo "下載 git-annex 失敗: $GIT_ANNEX_URL" >&2
            exit 1
          fi
          if ! echo "${GIT_ANNEX_SHA256}  /tmp/git-annex.tar.gz" | sha256sum -c -; then
            echo "" >&2
            echo "git-annex 的 SHA256 不符：上游 current/ 的內容已改變（釘選的版本：${GIT_ANNEX_VERSION}）。" >&2
            echo "這是 fail-closed，流程停在這裡不會動到真本。升級步驟見 docs/impl/group3-modules.md 第 7.1 節。" >&2
            exit 1
          fi
          sudo tar -xzf /tmp/git-annex.tar.gz -C /opt
          rm -f /tmp/git-annex.tar.gz
          sudo ln -sf /opt/git-annex.linux/git-annex /usr/local/bin/git-annex
          sudo ln -sf /opt/git-annex.linux/git-annex-shell /usr/local/bin/git-annex-shell
          sudo ln -sf /opt/git-annex.linux/git-remote-annex /usr/local/bin/git-remote-annex
          # 記錄實際跑起來的版本，方便下次升級時比對
          echo "git-annex version: $(git-annex version | head -1)"

          # rclone（downloads.rclone.org 的 /v<version>/ 是不可變的）
          curl -fsSL "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip" -o /tmp/rclone.zip
          echo "${RCLONE_SHA256}  /tmp/rclone.zip" | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 0755 "/tmp/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf /tmp/rclone.zip "/tmp/rclone-v${RCLONE_VERSION}-linux-amd64"

      - name: secrets-to-pin-key
        if: steps.prescan.outputs.shaped != '0'
        env:
          PIN_DEPLOY_KEY: ${{ secrets.PIN_DEPLOY_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "$PIN_DEPLOY_KEY" > "$RUNNER_TEMP/pin_deploy.key"
          chmod 600 "$RUNNER_TEMP/pin_deploy.key"

      - name: run
        if: steps.prescan.outputs.shaped != '0'
        env:
          AISTORAGE_RCLONE_CONF: ${{ runner.temp }}/rclone.conf
          AISTORAGE_PIN_KEY: ${{ runner.temp }}/pin_deploy.key
          AISTORAGE_PIN_KNOWN_HOSTS: config/github_known_hosts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m aistorage.committer run --config config/committer.json
