schema: spec-driven

context: |
  AiStorage is the stateful data layer of the owner's personal AI infrastructure
  (AiEntry = phone app whose resident AI is the "secretary"; AiContainer = MyLinuxPool
  workers whose resident AIs are "employees"; LLMGateway is a separate project).
  It has four independent storage elements: MyBrain, Atelier, Agora, Foundry.
  Vocabulary is defined in CONTEXT.md; binding decisions are in docs/adr/.
  Write all artifacts in Traditional Chinese, keeping CONTEXT.md terms verbatim.
  Constraints: single personal user; GitHub free plan only (no paid upgrade);
  existing storage subscriptions are Google Drive 5TB (consumer), AWS and Linode
  object storage (pay per use); avoid adding always-on services unless unavoidable;
  AiStorage must not live on AiContainer machines; AiEntry and AiContainer must never
  depend on each other. The owner has 10-20 hours per week, so work is phased and each
  phase must leave extension points for the next.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
