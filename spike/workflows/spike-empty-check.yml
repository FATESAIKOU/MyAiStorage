name: spike-empty-check

# 1.8 的空收件匣檢查（M1、N2）：以資料夾 id 列舉收件匣；空的就直接結束、
# **不安裝任何工具、不 clone repo**。
# 觸發方式：schedule（可註解掉）與 workflow_dispatch。
# 安全：不接受任何自由字串輸入；被任意觸發也只會讀一個資料夾的檔名清單並印出檔名。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: spike-empty-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout（只為了拿到 inbox_probe.py，不 clone Drive repo）
        uses: actions/checkout@v4

      - name: 計時起點
        run: echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 以資料夾 id 列出收件匣（純 Python，不安裝工具）
        id: inbox
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          INBOX_ID: ${{ vars.SPIKE_INBOX_ID }}
        run: |
          set -euo pipefail
          python3 spike/inbox_probe.py > /tmp/inbox.txt
          count="$(head -1 /tmp/inbox.txt)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "收件匣檔案數：$count" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -n +2 /tmp/inbox.txt | sed 's/^/  - /' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 空收件匣 → 不 clone、不裝工具
        if: steps.inbox.outputs.count == '0'
        run: |
          echo "EMPTY: 不 clone、不安裝工具（此步只到此為止）" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 非空收件匣 → 標記要跑完整流程（1.8 實測會走這條）
        if: steps.inbox.outputs.count != '0'
        run: |
          echo "NONEMPTY: 收件匣有 ${{ steps.inbox.outputs.count }} 個項目；完整提交流程的實測見 1.8" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"
