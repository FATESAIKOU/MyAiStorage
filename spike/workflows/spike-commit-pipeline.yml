name: spike-commit-pipeline

# 1.8 的合成提交流程：模擬真提交流程的形狀（比真流程簡化：沒有驗證、轉換、讀取視圖、索引）。
# 步驟：
#   1. 以資料夾 id 掃收件匣（純 Python，**安裝任何工具之前**）；空的直接結束
#   2. 非空 → 安裝 git-annex／rclone（與 Dockerfile 同版本與 sha256）
#   3. clone agora-load repo、做一個 commit（代表收下一個項目）
#   4. push main＋git-annex，**push 後用 ls-remote 驗證 remote head**（review H3：驗證成本算進耗時）
#   5. 記錄 clone／push／verify 耗時與計費分鐘
on:
  workflow_dispatch:
    inputs:
      force_nonempty:
        description: '收件匣為空時仍跑完整流程（量測用）'
        type: boolean
        default: false
      op:
        description: 'clone-only 只量 clone；full 才 push（避開與本地 500 次寫入的競爭）'
        type: choice
        options:
          - clone-only
          - full
        default: full

concurrency:
  group: spike-commit-pipeline
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout（拿 inbox_probe.py）
        uses: actions/checkout@v4

      - name: 時間起點
        run: echo "START_UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 以資料夾 id 掃收件匣（純 Python，未安裝工具）
        id: inbox
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          INBOX_ID: ${{ vars.SPIKE_INBOX_ID }}
        run: |
          set -euo pipefail
          python3 spike/inbox_probe.py > /tmp/inbox.txt
          count="$(head -1 /tmp/inbox.txt)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "收件匣檔案數：$count" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -n +2 /tmp/inbox.txt | sed 's/^/  - /' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 空收件匣 → 不裝工具、不 clone（計費到此為止）
        if: steps.inbox.outputs.count == '0' && !inputs.force_nonempty
        run: |
          echo "EMPTY: 不 clone、不安裝工具" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "EMPTY_UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 安裝 git-annex（與 Dockerfile 同版本同 sha256）
        if: steps.inbox.outputs.count != '0' || inputs.force_nonempty
        run: |
          set -euo pipefail
          ANNEX_SHA256=a3c9d10ee33a7ace69efeaa8cd6282cfd7444ec797d732cebae12a64efefa18a
          curl -fsSL "https://downloads.kitenet.net/git-annex/linux/current/git-annex-standalone-amd64.tar.gz" -o /tmp/git-annex.tar.gz
          echo "${ANNEX_SHA256}  /tmp/git-annex.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/git-annex.tar.gz -C /opt
          sudo ln -sf /opt/git-annex.linux/git-annex /usr/local/bin/git-annex
          sudo ln -sf /opt/git-annex.linux/git-annex-shell /usr/local/bin/git-annex-shell
          sudo ln -sf /opt/git-annex.linux/git-remote-annex /usr/local/bin/git-remote-annex
          sudo sed -i 's/^GIT_ANNEX_PACKAGE_INSTALL=$/GIT_ANNEX_PACKAGE_INSTALL=1/' /opt/git-annex.linux/runshell
          git annex version | sed -n 1p
          command -v git-remote-annex

      - name: 安裝 rclone（與 Dockerfile 同版本同 sha256）
        if: steps.inbox.outputs.count != '0' || inputs.force_nonempty
        run: |
          set -euo pipefail
          RCLONE_VERSION=1.75.1
          RCLONE_SHA256=982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab
          curl -fsSL "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip" -o /tmp/rclone.zip
          echo "${RCLONE_SHA256}  /tmp/rclone.zip" | sha256sum -c -
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 0755 "/tmp/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | sed -n 1p

      - name: 寫入 rclone conf（從 secret，不印出）
        if: steps.inbox.outputs.count != '0' || inputs.force_nonempty
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"; umask 077
          printf '%s' "$RCLONE_CONF" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          git config --global user.email 'spike@aistorage.invalid'
          git config --global user.name 'aistorage-spike-runner'
          echo "conf 已寫入，不印內容"

      - name: Clone ＋ Push ＋ 驗證（分段計時）
        if: steps.inbox.outputs.count != '0' || inputs.force_nonempty
        env:
          SPIKE_LOAD_REPO_URL: ${{ vars.SPIKE_LOAD_REPO_URL }}
        run: |
          set -euo pipefail
          [ -n "$SPIKE_LOAD_REPO_URL" ] || { echo "SPIKE_LOAD_REPO_URL 未設"; exit 1; }
          t0=$(date +%s%3N)
          git clone -b main "$SPIKE_LOAD_REPO_URL" /tmp/wt
          t1=$(date +%s%3N)
          echo "clone_history_ms=$((t1-t0))" | tee -a "$GITHUB_STEP_SUMMARY"
          git -C /tmp/wt log --oneline | sed -n 1p

          if [ "${{ inputs.op }}" = "clone-only" ]; then
            echo "clone-only：量 annex get（1GB 內容）後結束，不 push" | tee -a "$GITHUB_STEP_SUMMARY"
            cd /tmp/wt
            git annex init runner >/dev/null 2>&1 || true
            t2=$(date +%s%3N)
            git annex get bulk-1gb.bin
            t3=$(date +%s%3N)
            echo "annex_get_1gb_ms=$((t3-t2))" | tee -a "$GITHUB_STEP_SUMMARY"
            sha256sum bulk-1gb.bin | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "runner $(date -u +%Y-%m-%dT%H:%M:%SZ) $(git -C /tmp/wt rev-parse --short HEAD)" > /tmp/wt/runner-commit.txt
          git -C /tmp/wt add runner-commit.txt
          git -C /tmp/wt commit -qm "runner commit $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          new_head=$(git -C /tmp/wt rev-parse HEAD)

          t2=$(date +%s%3N)
          git -C /tmp/wt push origin main git-annex
          t3=$(date +%s%3N)
          # review H3：push 後的 ls-remote 驗證也算進提交耗時
          t4=$(date +%s%3N)
          remote_head=$(git -C /tmp/wt ls-remote origin refs/heads/main | cut -f1)
          t5=$(date +%s%3N)
          echo "push_ms=$((t3-t2))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "verify_ms=$((t5-t4))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "push_plus_verify_ms=$((t3-t2+t5-t4))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "local HEAD=$new_head remote main=$remote_head"
          if [ "$new_head" != "$remote_head" ]; then
            echo "::error::push 靜默失敗：remote main 沒有前進"
            exit 1
          fi

      - name: 時間終點與計費參考
        if: always()
        run: |
          echo "END_UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" | tee -a "$GITHUB_STEP_SUMMARY"
