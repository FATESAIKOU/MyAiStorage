[project]
name = "aistorage"
version = "0.1.0"
description = "AiStorage Phase 1 Core Library and Tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
# Agora 的單一指令入口。轉接器另外一個（`agora-<coding agent 名稱>`），
# 和同步器一起放在 src/aistorage/adapters/。
agora = "aistorage.agora_cli.__main__:main"
agora-opencode = "aistorage.adapters.opencode.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aistorage"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "aistorage/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: marks integration tests requiring Drive and GitHub credentials",
    "e2e: marks end-to-end tests requiring resident containers and e2e config (tasks 9.1-9.5)",
]
