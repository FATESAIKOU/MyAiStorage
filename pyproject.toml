[project]
name = "aistorage"
version = "0.1.0"
description = "AiStorage Phase 1 Core Library and Tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aistorage"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "aistorage/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks integration tests requiring Drive and GitHub credentials",
]
