[project]
name = "agora"
version = "0.1.0"
description = "Find, merge and continue coding-agent sessions stored as plain files on Google Drive"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6",
    "textual[syntax]>=8.2.8",
]

[project.scripts]
agora = "agora.cli:main"
sidecar = "sidecar.cli:main"

# The LLMGatewaySource extra (design D7) lands once LLMGateway tags lgw-v0.1.0:
# gateway = ["lgw @ git+https://github.com/FATESAIKOU/LLMGateway@lgw-v0.1.0"]
# Until then LLMGatewaySource is tested with injected connect/client doubles.

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agora", "src/sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: touches Drive agora-test/ or runs a real agent"]
